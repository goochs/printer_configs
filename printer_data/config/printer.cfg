[include hw-eddy.cfg]
[include hw-toolboard.cfg]
[include hw-toquecan.cfg]

[include mainsail.cfg]
[include macros.cfg]
[include macros-status.cfg]

[auto_speed]
[gcode_arcs]
[skew_correction]

[danger_options]
temp_ignore_limits: true

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_06003A000F50315939343520-if00

[temperature_sensor octopus_MCU]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 10
max_temp: 100

[virtual_sdcard]
path: /home/seth/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 375
max_accel: 17000
max_z_velocity: 30
max_z_accel: 350
square_corner_velocity: 5.0

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 0
position_max: 300
homing_speed: 60
homing_retract_dist: 20

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false
sense_resistor: 0.110
run_current: 1
home_current: 0.5
current_change_dwell_time: 0.2
sense_resistor: 0.110
diag_pin: ^PG6
driver_SGTHRS: 160

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 0
position_max: 309
homing_speed: 60
homing_retract_dist: 20

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
sense_resistor: 0.110
run_current: 1
home_current: 0.5
current_change_dwell_time: 0.2
diag_pin: ^PG9
driver_SGTHRS: 165

#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 230
position_min: -10
homing_speed: 15
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: false
run_current: 1
sense_resistor: 0.110
stealthchop_threshold: 999999

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: false
run_current: 1
sense_resistor: 0.110
stealthchop_threshold: 999999

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 1
sense_resistor: 0.110
stealthchop_threshold: 999999

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 1
sense_resistor: 0.110
stealthchop_threshold: 999999

#####################################################################
#   Bed Heater
#####################################################################

##  SSR Pin - HE1
##  Thermistor - TB
[heater_bed]
heater_pin: PA1
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF3
min_temp: 0
max_temp: 130
control: pid
pid_kp: 65.947
pid_ki: 3.008
pid_kd: 361.469

#####################################################################
#   Fan Control
#####################################################################

##  Controller fan - FAN2
#[controller_fan controller_fan]
#pin: PD12
#kick_start_time: 0.5
#heater: heater_bed
#fan_speed: 0.5

#  Exhaust fan - HE0
[temperature_fan filter]
pin: PA2
reverse: true
min_power: 0.3
max_power: 1.0
shutdown_speed: 1.0
control: pid
pid_Kp: 61.5
pid_Ki: 0.5
pid_Kd: 0
target_temp: 30
min_temp: 0
max_temp: 90
sensor_type: Generic 3950
sensor_pin: ebb:gpio28

#####################################################################
#   LED Control
#####################################################################

## Chamber Lighting - CNC_FAN5
[output_pin caselight]
pin: PD15
pwm: true
shutdown_value: 0
value: 0.2
cycle_time: 0.01

#####################################################################
#   Additional Sensors
#####################################################################

#[thermistor CMFB103F3950FANT]
#temperature1: 0.0
#resistance1: 32116.0
#temperature2: 40.0
#resistance2: 5309.0
#temperature3: 80.0
#resistance3: 1228.0

#[temperature_sensor chamber_temp]
## Chamber Temperature - T1
#sensor_type: CMFB103F3950FANT
#sensor_pin: PF5
#min_temp: 0
#max_temp: 100
#gcode_id: chamber_th

[filament_switch_sensor SFS_Presence]
switch_pin: ^PG14
pause_on_runout: False
runout_gcode:
  PAUSE
  M117 Filament switch runout
insert_gcode:
  M117 Filament switch inserted

[filament_motion_sensor SFS_Motion]
switch_pin: ^PG15
detection_length: 12
extruder: extruder
pause_on_runout: False
runout_gcode:
  PAUSE
  M117 Filament motion runout
insert_gcode:
  M117 Filament motion inserted

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

#[probe_eddy_ng btt_eddy]
#sensor_type: btt_eddy
#i2c_mcu: eddy
#i2c_bus: i2c0f
#x_offset: 0
#y_offset: 21.42
#tap_target_z: -0.800
#tap_max_samples: 10
#tap_mode: butter

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
amplitude_errors: both
#   Controls the amplitude related errors that will register as sensor failure.
#   Valid options are: none, low, high, both. Defaults to both, meaning
#   any amplitude related errors register as sensor failure.
z_offset: 2.5
#   The nominal distance (in mm) between the nozzle and bed that a
#   probing attempt should stop at. This parameter must be provided.
#i2c_address:
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 0
y_offset: 21.42
#speed:
#lift_speed:
#samples:
#sample_retract_dist:
#samples_result:
#samples_tolerance:
#samples_tolerance_retries:
register_as_probe: true

[safe_z_home]
home_xy_position: 150, 150
speed: 200
#z_hop: 10
#z_hop_speed: 10

[idle_timeout]
timeout: 1800

[quad_gantry_level]
gantry_corners:
   -60,-10
   360,370
points:
   50,25
   50,225
   250,225
   250,25

speed: 300
horizontal_move_z: 10
min_horizontal_move_z: 2.0
adaptive_horizontal_move_z: true
retries: 10
max_adjust: 10
retry_tolerance: 0.006
use_probe_xy_offsets: true

[bed_mesh]
mesh_min: 25, 25
mesh_max: 275, 275
probe_count: 11, 11
algorithm: bicubic

